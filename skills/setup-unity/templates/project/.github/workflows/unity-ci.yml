# Unity プロジェクトの PR ゲート（setup-unity が配布）。
#
# 見るのは**プロジェクトの整合性だけ**。Editor は起動しない。ライセンスも secret も要らず、
# 10 秒前後で返る（実測: 9 秒 / 11 秒）。
#
# **テストとコンパイル確認は CI でやらない。** Editor を起こすジョブは、イメージの pull・
# Library の初回インポート・ライセンス取得で 1 回 10 分以上かかり、PR ゲートとしては
# 使い物にならない（実測で判断）。ライセンス secret・seat・private パッケージのトークンと
# いった運用の面倒も全部そこから来ていた。テストはローカルで回す（`.claude/CLAUDE.md` に
# 回す順序を書いてある）。
#
# **ここに残す理由は git の checkout の側にある。** verify はローカルでも同じコマンドで
# 撃てるが、ローカルは作業ツリーを見るので、追跡外の実体（空ディレクトリ、gitignore された
# ファイル）が「ある」ものとして扱われる。CI は追跡されているものだけを見るので、
# clone した人の手元で初めて壊れる類の欠陥がここでしか出ない
# （実測: 空ディレクトリの .meta 2 件と、中身が gitignore されたフォルダの .meta 2 件）。
name: unity-ci

# paths / paths-ignore で絞らない。パスフィルタで skip された実行は「未完了」として扱われ、
# 必須チェックにしていると PR が永久にマージできなくなる。
# 10 秒のジョブを出し入れする仕組みは、それ自体のほうが高い。常に走らせる。
on:
  pull_request:
  push:
    branches: [main, master, develop]

# 同じブランチへ続けて push したとき、古い実行を捨てる。
concurrency:
  group: unity-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # **branch protection の必須チェックはこれ 1 つ。** 常に走るので skip の扱いを考えなくてよい。
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: ./.github/actions/setup-unity-cli
      # --strict で warning も落とす。META_MISSING / META_ORPHAN / GUID_DUPLICATE /
      # CONFLICT_MARKERS はどれもマージ事故の残骸で、放置するとビルドが壊れる。
      - run: unity projects verify --strict --format github --non-interactive
