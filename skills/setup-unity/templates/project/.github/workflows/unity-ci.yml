# Unity プロジェクトの PR ゲート（setup-unity が配布）。
#
# 2 段構え:
#   verify — Editor を起動せずプロジェクトの整合性を見る。数十秒で返るので早期に赤が出る
#   test   — Editor を起動して EditMode テストを走らせ、ついでにコーディング規約違反を拾う
#
# 規約違反（UCS 診断）は analyzer が warning として出す。Error にすると Unity が Safe Mode へ
# 落ちて Editor が作業不能になるため、severity は Warning のまま据え置き、**ここで落とす**。
# eslint の --max-warnings 0 と同じ考え方で、severity と gate を別レイヤーに分けている。
#
# 必要な secret（未設定だと test ジョブが赤くなる。verify は secret 不要で常に動く）:
#   UNITY_EMAIL    — Unity アカウントのメールアドレス
#   UNITY_PASSWORD — Unity アカウントのパスワード
#   UNITY_SERIAL   — 任意。永続ライセンス等でシリアルが要る契約のときだけ入れる
#                    （アカウントに seat が割り当てられていれば無くても通る。実測）
#
# **Personal では動かない。** アカウントに Plus / Pro 以上の seat が要る。
# Unity は Personal のオフライン有効化を Enterprise / Industry 限定にしており、
# 手元の .ulf を持ち込む経路も Licensing Client が拒否する（どちらも実測）。
# verify ジョブはライセンス不要なので、Personal のプロジェクトでもそちらは動く。
name: unity-ci

# paths / paths-ignore で絞らない。branch protection の必須チェックにしたとき、
# パスフィルタで skip された実行は「未完了」として扱われ、PR が永久にマージできなくなる。
# docs だけの PR でも Editor が起動する分は払う。
on:
  pull_request:
  push:
    branches: [main, master, develop]

# 同じブランチへ続けて push したとき、古い実行を捨てる。Editor の起動は高価なので、
# 追い越された実行に Actions 分数を払わない。
concurrency:
  group: unity-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Editor 版を ProjectSettings/ProjectVersion.txt から取り出して後続へ渡す。
  # ワークフローに版を直書きすると、Editor を上げたときに黙ってズレる。
  resolve:
    runs-on: ubuntu-latest
    outputs:
      editor-version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          version=$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "::error::ProjectSettings/ProjectVersion.txt から m_EditorVersion を読めませんでした"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Editor: $version"

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: ./.github/actions/setup-unity-cli
      # --strict で warning も落とす。META_MISSING / GUID_DUPLICATE / CONFLICT_MARKERS は
      # どれもマージ事故の残骸で、放置するとビルドが壊れる。
      - run: unity projects verify --strict --format github --non-interactive

  test:
    needs: [resolve]
    runs-on: ubuntu-latest
    # GameCI の Editor 入りイメージ。headless の Unity に要るシステムライブラリが揃っている。
    # 末尾の数字は GameCI 側のイメージ改訂番号で、Editor 版からは導出できない（手で上げる）。
    # 取り違えても image pull が失敗して赤くなるだけで、静かに間違った版で走ることはない。
    container:
      image: unityci/editor:${{ needs.resolve.outputs.editor-version }}-base-3
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: ./.github/actions/setup-unity-cli

      # イメージ内の Editor の所在を先に確定させる。パスが違えば診断を出してここで落とす
      # （--editor-path を外すと CLI が Hub のレジストリを見に行き、CI では別の失敗に化ける）。
      - name: Editor の所在を確認
        run: |
          editor="${UNITY_PATH:-/opt/unity}/Editor/Unity"
          if [ ! -x "$editor" ]; then
            echo "::error::Unity Editor が $editor にありません（UNITY_PATH=${UNITY_PATH:-未設定}）"
            ls -la /opt 2>/dev/null || true
            exit 1
          fi
          echo "UNITY_EDITOR=$editor" >> "$GITHUB_ENV"

      # Library をキャッシュする。初回インポートは数十分かかるので、これが無いと毎回それを払う。
      # キーに Packages/ProjectSettings を含めるのは、パッケージ構成が変わると Library が
      # 作り直しになるため。restore-keys で近いものから温める。
      # 高いのはアセットのインポートで、スクリプトのコンパイルは安い。後者は次のステップで捨てる。
      - uses: actions/cache@v4
        with:
          path: Library
          key: "Library-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/**') }}"
          restore-keys: |
            Library-

      # **ライセンスだけ Unity CLI を使わない。**
      # `unity license activate` はどの経路でもサインイン済みセッションを要求し、
      # `unity auth login` は資格情報を OS のキーリングへ保存しようとする。
      # コンテナにキーリングは無いので、CLI 経由ではライセンスを取れない（実測）。
      # Editor バイナリへ直接渡す形（GameCI と同じ）ならその段が無い。
      # test / verify は CLI のままでよい — Editor を起こすのはライセンス取得後だから。
      - name: ライセンス認証
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Unity ライセンスの secret が未設定です。UNITY_EMAIL / UNITY_PASSWORD をリポジトリの secrets に登録してください（シリアルが要る契約なら UNITY_SERIAL も）"
            exit 1
          fi
          # 認証情報はコマンド行に載る。GitHub がログをマスクするが、
          # `ps` からは見えるため、この runner を他人と共有しないこと。
          xvfb-run --auto-servernum "$UNITY_EDITOR" \
            -batchmode -nographics -logFile /dev/stdout -quit \
            ${UNITY_SERIAL:+-serial "$UNITY_SERIAL"} \
            -username "$UNITY_EMAIL" \
            -password "$UNITY_PASSWORD"

      # **スクリプトのコンパイル成果物だけ捨てる。**
      # 温まった Library のまま走らせると Unity は再コンパイルせず、analyzer の警告が
      # 1 行も出ない（実測済み: 2 回目の実行で UCS が 0 件になる）。次のステップの gate は
      # コンパイルログを見るので、これを消さないと**違反があっても静かに緑になる**。
      # Library/Artifacts（アセットのインポート結果）は残るのでキャッシュの効果は保たれる。
      - name: スクリプトの再コンパイルを強制する
        run: rm -rf Library/ScriptAssemblies Library/Bee

      - name: EditMode テスト
        id: test
        env:
          # 全件実行が既定。外部パッケージ由来の常時失敗テストを抱えるプロジェクトだけ、
          # ここに値を入れて自分のテスト名前空間へ絞る（--filter は選択であって除外ではない）。
          # ローカルの /test-unity は差分から対象を導出するので、この値は CI 専用。
          TEST_FILTER: ""
        run: |
          # **仮想ディスプレイが要る。** Unity は batchmode でも X ディスプレイを開こうとし、
          # 無いと Editor がテストを 1 件も走らせずに終了する
          # （実測: "Error opening default X display." で exit 1）。
          # `unity test` には -nographics を渡す口が無いので、xvfb で包む。
          # 無い環境で黙って進まないよう、存在を確認して落とす。
          if ! command -v xvfb-run > /dev/null; then
            echo "::error::xvfb-run がありません。Unity が X ディスプレイを開けず Editor が起動しません"
            exit 1
          fi
          xvfb-run --auto-servernum \
            unity test --mode EditMode \
              --editor-path "$UNITY_EDITOR" \
              ${TEST_FILTER:+--filter "$TEST_FILTER"} \
              --non-interactive

      # テストが落ちても規約違反は見たいので always()。テスト自体が走らなかったときだけ飛ばす。
      #
      # **`unity test` の標準出力にコンパイル警告は載らない**（実測済み: 出力は空）。
      # 診断は Editor が既定のログファイルへ書くので、そこを読む。
      # ログが見つからないときは緑にせず落とす — 「違反ゼロ」と「見ていない」は
      # 外から区別が付かず、素通しの gate は無い gate より悪い。
      - name: コーディング規約違反（UCS）を検出したら落とす
        if: always() && steps.test.outcome != 'skipped'
        run: |
          log=""
          for candidate in \
            "$HOME/.config/unity3d/Editor.log" \
            "$HOME/.config/unity3d/Unity/Editor/Editor.log"; do
            if [ -f "$candidate" ]; then log="$candidate"; break; fi
          done
          if [ -z "$log" ]; then
            echo "::error::Editor のログが見つからず、規約違反を検査できませんでした（Editor が起動しなかった可能性。前のステップの失敗を先に見る）"
            find "$HOME/.config" -name "*.log" 2>/dev/null | head -20
            exit 1
          fi
          echo "EDITOR_LOG=$log" >> "$GITHUB_ENV"
          if grep -nE "warning UCS[0-9]{4}" "$log"; then
            echo "::error::コーディング規約違反が残っています（上の行）。.claude/rules/coding-standards.md を参照して直してください"
            exit 1
          fi

      - name: テスト結果を残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results
          path: |
            test-results.xml
            ${{ env.EDITOR_LOG }}
          if-no-files-found: warn

      # seat は有限（Pro のシリアルは同時 2 台まで）。ジョブが落ちても返すので always()。
      # 返せなかった枠は Unity のダッシュボードから手で取り消せる。
      - name: ライセンス返却
        if: always()
        run: |
          xvfb-run --auto-servernum "$UNITY_EDITOR" \
            -batchmode -nographics -logFile /dev/stdout -quit \
            -returnlicense || echo "::warning::ライセンスの返却に失敗しました（seat を消費したままの可能性があります）"
