# Unity プロジェクトの PR ゲート（setup-unity が配布）。
#
# 2 段構え:
#   verify — Editor を起動せずプロジェクトの整合性を見る。数十秒で返るので早期に赤が出る
#   test   — Editor を起動して EditMode / PlayMode のテストを走らせ、ついでにコーディング規約違反を拾う
#
# 規約違反（UCS 診断）は analyzer が warning として出す。Error にすると Unity が Safe Mode へ
# 落ちて Editor が作業不能になるため、severity は Warning のまま据え置き、**ここで落とす**。
# eslint の --max-warnings 0 と同じ考え方で、severity と gate を別レイヤーに分けている。
#
# 必要な secret（未設定だと test ジョブが赤くなる。verify は secret 不要で常に動く）:
#   UNITY_EMAIL    — Unity アカウントのメールアドレス
#   UNITY_PASSWORD — Unity アカウントのパスワード
#   UNITY_SERIAL   — 任意。永続ライセンス等でシリアルが要る契約のときだけ入れる
#                    （アカウントに seat が割り当てられていれば無くても通る。実測）
#   UNITY_PACKAGES_TOKEN
#                  — 任意。Packages/manifest.json が private repo を git URL で参照する
#                    ときだけ要る。無いと Package Manager がそこで止まり Unity が exit 1
#
# **Personal では動かない。** アカウントに Plus / Pro 以上の seat が要る。
# Unity は Personal のオフライン有効化を Enterprise / Industry 限定にしており、
# 手元の .ulf を持ち込む経路も Licensing Client が拒否する（どちらも実測）。
# verify ジョブはライセンス不要なので、Personal のプロジェクトでもそちらは動く。
name: unity-ci

# paths / paths-ignore で絞らない。パスフィルタで skip された実行は「未完了」として扱われ、
# 必須チェックにしていると PR が永久にマージできなくなる。
# 代わりに **workflow は必ず起動し、変更の種類で走らせるジョブを変える**（changes ジョブ）。
# 必須チェックにするのは最後の gate ジョブ 1 つだけ。
on:
  pull_request:
  push:
    branches: [main, master, develop]

# **すべての run: を bash で走らせる。** container 上のジョブは既定シェルが `sh` になり、
# bash 前提の構文が実行時の構文エラーで落ちる（実測: dash が `done <<< "$var"` を
# `Syntax error: redirection unexpected` で拒否し、test ジョブが丸ごと止まった）。
# イメージには bash が入っている（setup-unity-cli も `shell: bash` で動いている）ので、
# runner の既定に任せず宣言する。
defaults:
  run:
    shell: bash

# 同じブランチへ続けて push したとき、古い実行を捨てる。Editor の起動は高価なので、
# 追い越された実行に Actions 分数を払わない。
concurrency:
  group: unity-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 変更の種類で走らせる検査を変える。全部を常に走らせると、ドキュメントだけの PR でも
  # Editor の起動（10〜30 分）を払う。逆にパスフィルタで workflow ごと skip すると
  # 必須チェックが「未完了」になって PR がマージできない（上のコメント参照）ので、
  # **workflow は必ず起動し、ジョブ単位で出し入れする**。最終判定は gate ジョブが返す。
  #
  # | 変更 | verify | EditMode | PlayMode | UCS gate | 件数チェック |
  # |:--|:--:|:--:|:--:|:--:|:--:|
  # | コンパイル入力（下記 code） | ✅ | ✅ | ✅ | ✅ | ✅ |
  # | Assets のシーン・prefab 等 | ✅ | – | ✅ | – | – |
  # | .md / .github / .claude のみ | – | – | – | – | – |
  #
  # EditMode は plain class のロジックしか見ないのでアセット変更では要らない。
  # PlayMode はシーンと prefab を読むのでどちらでも要る。UCS gate は Editor の
  # コンパイルログを読むので、再コンパイルが起きない変更では「見ていない」緑になるだけ。
  # 件数チェックは絞り込みの破綻を見る段で、それはコード側の変更から来るので code に揃える
  # （EditMode を飛ばした回に走らせると、EditMode テストしか持たないプロジェクトを
  #  「テストがあるのに 0 件」と誤って落とす）。
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
      assets: ${{ steps.detect.outputs.assets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # **比較元が取れないときは絞らない。** 初回 push や force push の後は before が
          # 空だったり親を辿れなかったりする。判定不能を「変更なし」と読み替えると、
          # 検査を落としたまま緑で通る。
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "比較元が取れないので全ての検査を走らせる（BASE_SHA=${BASE_SHA:-空}）"
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "assets=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # core.quotepath=false が無いと、非 ASCII を含むパスが "..." で囲まれエスケープされる。
          # すると下の判定に一致せず「変更なし」と読み、検査を落としたまま緑で通る。
          files=$(git -c core.quotepath=false diff --name-only "$BASE_SHA" HEAD)
          echo "変更ファイル:"
          printf '%s\n' "$files" | sed 's/^/  /'

          code=false
          assets=false
          # **コンパイルの入力になるものは全部 code。** 狭く取ると EditMode と UCS gate を
          # 飛ばしたまま緑になる（取りこぼしは気付けない。無駄な実行は時間だけ払う）。
          #   .cs / .asmdef / .asmref — ソースとアセンブリ構成・参照
          #   .dll / .rsp             — analyzer や外部アセンブリ、コンパイラ応答ファイル
          #   ProjectSettings/        — scripting define、Editor 版
          #   Packages/*.json         — 依存パッケージ
          if printf '%s\n' "$files" | grep -qE '\.(cs|asmdef|asmref|dll|rsp)$|^ProjectSettings/|^Packages/.*\.json$'; then
            code=true
          fi
          # verify が見る対象と、PlayMode が読むアセット。
          if printf '%s\n' "$files" | grep -qE '^(Assets|ProjectSettings)/|^Packages/.*\.json$'; then
            assets=true
          fi
          echo "code=$code / assets=$assets"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "assets=$assets" >> "$GITHUB_OUTPUT"

  # Editor 版を ProjectSettings/ProjectVersion.txt から取り出して後続へ渡す。
  # ワークフローに版を直書きすると、Editor を上げたときに黙ってズレる。
  resolve:
    runs-on: ubuntu-latest
    outputs:
      editor-version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          version=$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "::error::ProjectSettings/ProjectVersion.txt から m_EditorVersion を読めませんでした"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Editor: $version"

  verify:
    needs: [changes]
    if: needs.changes.outputs.assets == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: ./.github/actions/setup-unity-cli
      # --strict で warning も落とす。META_MISSING / GUID_DUPLICATE / CONFLICT_MARKERS は
      # どれもマージ事故の残骸で、放置するとビルドが壊れる。
      - run: unity projects verify --strict --format github --non-interactive

  test:
    needs: [resolve, changes]
    # ジョブごと飛ばすのは container のイメージ pull がどの step より前に走るため。
    # step を if で飛ばしても数 GB の pull 時間は払う。
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.assets == 'true'
    runs-on: ubuntu-latest
    # GameCI の Editor 入りイメージ。headless の Unity に要るシステムライブラリが揃っている。
    # 末尾の数字は GameCI 側のイメージ改訂番号で、Editor 版からは導出できない（手で上げる）。
    # 取り違えても image pull が失敗して赤くなるだけで、静かに間違った版で走ることはない。
    container:
      image: unityci/editor:${{ needs.resolve.outputs.editor-version }}-base-3
    # テスト実行と件数チェックの両方が読むので、ジョブ側に 1 箇所だけ置く。
    env:
      # 全件実行が既定。外部パッケージ由来の常時失敗テストを抱えるプロジェクトだけ、
      # ここに値を入れて自分のテスト名前空間へ絞る（--filter は選択であって除外ではない）。
      # ローカルでは差分のスコープだけ回すので、この値は CI 専用。
      TEST_FILTER: ""
      # PlayMode はフレーム経過やシーン読み込みを待つため、実装の不具合で永久に返らないことが
      # ある。既定は無効なので明示する（Actions の 6 時間上限まで回し続けるのを避ける）。
      TEST_TIMEOUT: "1800"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: ./.github/actions/setup-unity-cli

      # イメージ内の Editor の所在を先に確定させる。パスが違えば診断を出してここで落とす
      # （--editor-path を外すと CLI が Hub のレジストリを見に行き、CI では別の失敗に化ける）。
      - name: Editor の所在を確認
        run: |
          editor="${UNITY_PATH:-/opt/unity}/Editor/Unity"
          if [ ! -x "$editor" ]; then
            echo "::error::Unity Editor が $editor にありません（UNITY_PATH=${UNITY_PATH:-未設定}）"
            ls -la /opt 2>/dev/null || true
            exit 1
          fi
          echo "UNITY_EDITOR=$editor" >> "$GITHUB_ENV"

      # Library をキャッシュする。初回インポートは数十分かかるので、これが無いと毎回それを払う。
      # キーに Packages/ProjectSettings を含めるのは、パッケージ構成が変わると Library が
      # 作り直しになるため。restore-keys で近いものから温める。
      # 高いのはアセットのインポートで、スクリプトのコンパイルは安い。後者は次のステップで捨てる。
      - uses: actions/cache@v4
        with:
          path: Library
          key: "Library-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/**') }}"
          restore-keys: |
            Library-

      # **private repo を git URL で参照するパッケージは、認証が無いと CI で必ず止まる。**
      # Package Manager は git を起動して取得するが、CI には資格情報が無く端末も無いので
      # 解決に失敗し、Unity はテストを 1 件も走らせず exit 1 する（実測）:
      #   Project has invalid dependencies:
      #     <package>: Error when executing git command.
      #     fatal: could not read Username for 'https://github.com': terminal prompts disabled
      # **この失敗は `unity test` の出力に出ない。** Editor ログにしか書かれず、CLI は
      # 無関係な license の警告 1 行だけを見せる（下の「失敗したら〜」がそれを補う）。
      #
      # トークンは任意。public しか参照しないプロジェクトに secret を強制しない。
      # 差し込む先を github.com の https に限る — 他のホストへトークンを送らない。
      - name: private git パッケージの取得を通す
        env:
          PACKAGES_TOKEN: ${{ secrets.UNITY_PACKAGES_TOKEN }}
        run: |
          if [ -z "$PACKAGES_TOKEN" ]; then
            echo "UNITY_PACKAGES_TOKEN は未設定。public なパッケージだけを取得する"
            exit 0
          fi
          # **トークンを argv に載せない。** `git config <key> <value>` だと URL ごと
          # コマンド行に乗り、`ps` から見える。ヒアドキュメントで設定ファイルへ直接書く。
          cat >> "$HOME/.gitconfig" <<EOF
          [url "https://x-access-token:$PACKAGES_TOKEN@github.com/"]
          insteadOf = https://github.com/
          EOF
          echo "github.com への git 取得にトークンを差し込んだ（$HOME/.gitconfig）"

      # **Editor が書く先を先に作る。** container の $HOME は runner が空のディレクトリを
      # bind mount するので、`.local/share` も `.cache` も存在しない。Unity は
      # ライセンス情報の置き場をここに作ろうとするが、この経路は親を再帰的に作らないため
      # 失敗する（実測）:
      #   Editor preferences folder (…/.local/share/unity3d) does not exist and could not be created.
      #   CreateDirectory '…/.cache/unity3d' failed
      # $HOME が書けないわけではない（Editor のログは同じ $HOME 配下に書けている）。
      # 親が無いだけなので先に作る。**これはノイズ潰しで、テストの失敗要因ではない。**
      # 実測ではこの 2 行が出ていてもライセンスは解決できていた。消しておくのは、
      # 本物の失敗を追うときに紛れ込ませないため。
      # 権限が原因ならここで mkdir が落ちて理由が出る。黙って先へ進ませない。
      - name: Editor の書き込み先を用意する
        run: mkdir -p "$HOME/.local/share/unity3d" "$HOME/.cache/unity3d" "$HOME/.config/unity3d"

      # **ライセンスだけ Unity CLI を使わない。**
      # `unity license activate` はどの経路でもサインイン済みセッションを要求し、
      # `unity auth login` は資格情報を OS のキーリングへ保存しようとする。
      # コンテナにキーリングは無いので、CLI 経由ではライセンスを取れない（実測）。
      # Editor バイナリへ直接渡す形（GameCI と同じ）ならその段が無い。
      # test / verify は CLI のままでよい — Editor を起こすのはライセンス取得後だから。
      - name: ライセンス認証
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Unity ライセンスの secret が未設定です。UNITY_EMAIL / UNITY_PASSWORD をリポジトリの secrets に登録してください（シリアルが要る契約なら UNITY_SERIAL も）"
            exit 1
          fi
          # 認証情報はコマンド行に載る。GitHub がログをマスクするが、
          # `ps` からは見えるため、この runner を他人と共有しないこと。
          xvfb-run --auto-servernum "$UNITY_EDITOR" \
            -batchmode -nographics -logFile /dev/stdout -quit \
            ${UNITY_SERIAL:+-serial "$UNITY_SERIAL"} \
            -username "$UNITY_EMAIL" \
            -password "$UNITY_PASSWORD"

      # **スクリプトのコンパイル成果物だけ捨てる。**
      # 温まった Library のまま走らせると Unity は再コンパイルせず、analyzer の警告が
      # 1 行も出ない（実測済み: 2 回目の実行で UCS が 0 件になる）。次のステップの gate は
      # コンパイルログを見るので、これを消さないと**違反があっても静かに緑になる**。
      # Library/Artifacts（アセットのインポート結果）は残るのでキャッシュの効果は保たれる。
      - name: スクリプトの再コンパイルを強制する
        run: rm -rf Library/ScriptAssemblies Library/Bee

      # **走らせるテストは Assets/App/ 配下のホワイトリスト。**
      # 除外リストは作らない。Assets/ThirdParty/ も Packages/ も外部アセットの置き場は
      # 数え上げられず、漏れれば直せないテストの失敗で PR が赤くなる（analyzer と同じ理由）。
      #
      # `unity test --filter` はテスト名（namespace.クラス.メソッド）に当たるので、
      # Assets/App/ 配下のテスト asmdef から名前空間の接頭辞を集める:
      #   rootNamespace があればそれ / 無ければ asmdef 名から末尾の .EditMode / .PlayMode を落とす
      #
      # **複数の区切りはセミコロン。**（Unity 6.3 系 + CLI 1.0.0-beta.8 で実測）
      #   `A.*`           → A だけ走る
      #   `A.*;B.*`       → A と B が走る。存在しない名前空間は無視される
      #   `A.*,B.*`       → **カンマは効かない。0 件になる**
      #   `--filter` 2 回 → **最後の 1 つだけ効く**
      #
      # **filter は必ず埋める。空にすると全件になり、ホワイトリストが崩れる。**
      # App にテストアセンブリが無いときは何にもマッチしない値を入れる — Editor は起動して
      # コンパイルさせつつ（規約違反の gate がそのログを読む）、外部のテストは走らせない。
      # TEST_FILTER が手で設定されていればそちらが優先。
      - name: テスト範囲を決める
        id: scope
        run: |
          if [ -n "$TEST_FILTER" ]; then
            echo "TEST_FILTER が設定されているのでそちらを使う: $TEST_FILTER"
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
            echo "filter=$TEST_FILTER" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # テストアセンブリの見分け方は 1 つではない。どれか 1 つでも当たれば対象。
          #   precompiledReferences に nunit.framework.dll  — 現行の形
          #   optionalUnityReferences に TestAssemblies      — Unity が今も受ける旧形式
          #   references に UnityEngine/UnityEditor.TestRunner — 明示参照する書き方
          # 1 つだけを見ると、実在するテストを 0 件と誤判定して緑で通してしまう。
          asmdefs=""
          if [ -d Assets/App ]; then
            asmdefs=$(grep -rlE 'nunit\.framework\.dll|TestAssemblies|Unity(Engine|Editor)\.TestRunner' \
              Assets/App --include='*.asmdef' 2>/dev/null || true)
          fi
          prefixes=""
          # パスに空白を含む asmdef があるので 1 行ずつ読む（$asmdefs の単語分割に頼らない）。
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            echo "  テストアセンブリ: $f"
            ns=$(sed -n 's/.*"rootNamespace"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$f" | head -1)
            if [ -z "$ns" ]; then
              ns=$(sed -n 's/.*"name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$f" | head -1)
              ns=${ns%.EditMode}
              ns=${ns%.PlayMode}
            fi
            # 名前空間に空白は入らないので、ここは空白区切りで足してよい
            # （空白安全にしたいのは asmdef の**パス**の方）。
            [ -n "$ns" ] && prefixes="$prefixes $ns"
          done <<< "$asmdefs"
          uniq=$(printf '%s\n' $prefixes | sed '/^$/d' | sort -u)
          if [ -z "$uniq" ]; then
            # 何にもマッチしない値。Editor は起動するがテストは 0 件になる。
            echo "Assets/App/ 配下にテストアセンブリがありません（テストの成否は判定しません）"
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "filter=__no_app_tests__" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 複数あればセミコロンで並べる（実測で効く区切り。カンマは効かない）。
          filter=$(echo "$uniq" | sed 's/$/.*/' | paste -sd';' -)
          echo "has_tests=true" >> "$GITHUB_OUTPUT"
          echo "filter=$filter" >> "$GITHUB_OUTPUT"
          echo "ホワイトリスト: $filter"

      # EditMode と PlayMode を順に走らせる。**matrix で並列にしない** — seat は同時 2 台までで、
      # 並列にすると自分のジョブ同士で seat を食い合う。同一ジョブなら取得済みのライセンスと
      # 温まった Library をそのまま使える。
      # 片方が落ちても他方は走らせる（先に落ちた側だけ見て直すと、もう一方の失敗が次の PR に回る）。
      - name: EditMode / PlayMode テスト
        id: test
        env:
          FILTER: ${{ steps.scope.outputs.filter }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          # **仮想ディスプレイが要る。** Unity は batchmode でも X ディスプレイを開こうとし、
          # 無いと Editor がテストを 1 件も走らせずに終了する
          # （実測: "Error opening default X display." で exit 1）。
          # `unity test` には -nographics を渡す口が無いので、xvfb で包む。
          # 無い環境で黙って進まないよう、存在を確認して落とす。
          if ! command -v xvfb-run > /dev/null; then
            echo "::error::xvfb-run がありません。Unity が X ディスプレイを開けず Editor が起動しません"
            exit 1
          fi
          rc=0
          for mode in EditMode PlayMode; do
            # EditMode は plain class のロジックしか見ないので、コードが変わっていなければ
            # 回す意味がない（PlayMode はシーンと prefab を読むので常に回す）。
            if [ "$mode" = "EditMode" ] && [ "$CODE" != "true" ]; then
              echo "EditMode は skip（コードの変更なし）"
              continue
            fi
            echo "::group::$mode"
            # 出力先を mode ごとに分ける（既定は両方 test-results.xml で、後者が前者を潰す）
            xvfb-run --auto-servernum \
              unity test --mode "$mode" \
                --editor-path "$UNITY_EDITOR" \
                --output "test-results-$(echo "$mode" | tr 'A-Z' 'a-z').xml" \
                --timeout "$TEST_TIMEOUT" \
                ${FILTER:+--filter "$FILTER"} \
                --non-interactive || rc=$?
            echo "::endgroup::"
          done
          exit $rc

      # **`--filter` は 0 件マッチでも exit 0 を返す。** 名前空間をリネームすると
      # 「1 件も走らなかった」がそのまま緑として通る。件数はここで見る
      # （人に数えさせる手順にすると忘れられるので、構造で止める）。
      # 結果 XML が読めないときも落とす — 「0 件」と「見ていない」は外から区別が付かない。
      #
      # 両モードの合計で見る。片方が 0 件なのは正常（PlayMode テストを持たないプロジェクト）。
      # 合計 0 件は、絞り込みが外れているか、テスト asmdef が壊れているかのどちらか。
      #
      # **テストアセンブリが 1 つも無いプロジェクトではこの段ごと飛ばす**（has_tests == false）。
      # 「まだテストを書いていない」を赤にしない。テストの成否そのものは前の step が判定
      # 済みで、ここは「走ったはずのものが走ったか」だけを見る段。
      - name: テストが 1 件も走っていなければ落とす
        if: steps.test.outcome == 'success' && steps.scope.outputs.has_tests == 'true' && needs.changes.outputs.code == 'true'
        env:
          FILTER: ${{ steps.scope.outputs.filter }}
        run: |
          sum=0
          seen=0
          for xml in test-results-editmode.xml test-results-playmode.xml; do
            [ -f "$xml" ] || continue
            seen=1
            # NUnit XML の root は <test-run ... total="N" ...>。属性の並び順に依存しないよう
            # 属性だけを抜いて数字を取る（total は test-suite にも出るので root の 1 件目）。
            n=$(grep -o 'total="[0-9]*"' "$xml" | head -1 | tr -dc '0-9')
            if [ -z "$n" ]; then
              echo "::error::$xml から test-run の total を読めませんでした"
              head -c 500 "$xml"
              exit 1
            fi
            echo "$xml: $n 件"
            sum=$((sum + n))
          done
          if [ "$seen" -eq 0 ]; then
            echo "::error::結果 XML が 1 つも無く、実行件数を確認できませんでした（unity test が結果を書いていない）"
            exit 1
          fi
          echo "合計: $sum 件"
          if [ "$sum" -eq 0 ]; then
            echo "::error::テストアセンブリはあるのに 1 件も実行されていません。絞り込み（$FILTER）が何にもマッチしていないか、テスト asmdef が壊れています"
            exit 1
          fi

      # Editor ログの所在を**ここ 1 箇所で**決める。UCS gate と失敗時のダンプが読む。
      # 候補のパスを両方に書くと、片方だけ直したときに黙ってズレる。
      # ここでは落とさない（見つからないことの意味は読む側の段で決まる）。
      - name: Editor ログの所在を確定する
        id: editorlog
        if: always() && steps.test.outcome != 'skipped'
        run: |
          for candidate in \
            "$HOME/.config/unity3d/Editor.log" \
            "$HOME/.config/unity3d/Unity/Editor/Editor.log"; do
            if [ -f "$candidate" ]; then
              echo "Editor ログ: $candidate"
              echo "log=$candidate" >> "$GITHUB_OUTPUT"
              # artifact のアップロード先に渡す。
              echo "EDITOR_LOG=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::warning::Editor のログが見つかりませんでした（Editor が起動しなかった可能性）"
          find "$HOME/.config" -name "*.log" 2>/dev/null | head -20

      # **`unity test` が見せるエラーを信用しない。** CLI は Editor ログから拾った数行しか
      # 出さない。実測では無関係な license の警告 1 行だけが出て、本当の原因
      # （private git パッケージの解決失敗で Unity が exit 1）はログ本体にしか無く、
      # 誤った原因を 2 回追いかけた。落ちたらログから本物のエラーを出す。
      #
      # 末尾も出す。致命的な理由はログの最後に来ることが多く（上の実測もそう）、
      # 既知のパターンに一致しない失敗を「静かに何も出ない」にしないため。
      - name: 失敗したら Editor ログのエラーを出す
        if: failure() && steps.test.outcome == 'failure' && steps.editorlog.outputs.log != ''
        env:
          LOG: ${{ steps.editorlog.outputs.log }}
        run: |
          echo "::group::Editor ログのエラー行"
          grep -nE "error CS[0-9]+|invalid dependencies|An error occurred|Unhandled|Exception:|Fatal Error|Aborting batchmode|Failed to |Unable to " \
            "$LOG" | head -60 || echo "既知のパターンには一致しなかった"
          echo "::endgroup::"
          echo "::group::Editor ログの末尾"
          tail -60 "$LOG"
          echo "::endgroup::"

      # テストが落ちても規約違反は見たいので always()。テスト自体が走らなかったときだけ飛ばす。
      # **`unity test` の標準出力にコンパイル警告は載らない**（実測済み: 出力は空）。
      # 診断は Editor が既定のログファイルへ書くので、そこを読む。
      - name: コーディング規約違反（UCS）を検出したら落とす
        if: always() && steps.test.outcome != 'skipped' && needs.changes.outputs.code == 'true'
        env:
          LOG: ${{ steps.editorlog.outputs.log }}
        run: |
          # ログが見つからないときは緑にせず落とす — 「違反ゼロ」と「見ていない」は
          # 外から区別が付かず、素通しの gate は無い gate より悪い。
          if [ -z "$LOG" ]; then
            echo "::error::Editor のログが見つからず、規約違反を検査できませんでした（Editor が起動しなかった可能性。前のステップの失敗を先に見る）"
            exit 1
          fi
          if grep -nE "warning UCS[0-9]{4}" "$LOG"; then
            echo "::error::コーディング規約違反が残っています（上の行）。.claude/rules/coding-standards.md を参照して直してください"
            exit 1
          fi

      - name: テスト結果を残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results
          path: |
            test-results-editmode.xml
            test-results-playmode.xml
            ${{ env.EDITOR_LOG }}
          if-no-files-found: warn

      # seat は有限（Pro のシリアルは同時 2 台まで）。ジョブが落ちても返すので always()。
      # 返せなかった枠は Unity のダッシュボードから手で取り消せる。
      - name: ライセンス返却
        if: always()
        run: |
          xvfb-run --auto-servernum "$UNITY_EDITOR" \
            -batchmode -nographics -logFile /dev/stdout -quit \
            -returnlicense || echo "::warning::ライセンスの返却に失敗しました（seat を消費したままの可能性があります）"

  # **branch protection の必須チェックはこれ 1 つにする。**
  # verify / test は変更の種類で skip される。skipped が必須チェックで pass 扱いに
  # なるかは GitHub 側の仕様に依存するので、そこに賭けない — 常に走るこのジョブが
  # 結果をまとめて返す。skip は「その検査が要らない変更だった」なので通す。
  gate:
    needs: [changes, resolve, verify, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 検査の結果をまとめる
        env:
          CHANGES: ${{ needs.changes.result }}
          RESOLVE: ${{ needs.resolve.result }}
          VERIFY: ${{ needs.verify.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "changes=$CHANGES / resolve=$RESOLVE / verify=$VERIFY / test=$TEST"
          failed=0
          # **resolve も見る。** resolve が落ちると test は skipped になり、skip を通す
          # このジョブだけでは「Editor 版が読めなかった」実行が緑で抜ける。
          for pair in "changes:$CHANGES" "resolve:$RESOLVE" "verify:$VERIFY" "test:$TEST"; do
            name=${pair%%:*}
            result=${pair#*:}
            case "$result" in
              success|skipped) ;;
              *) echo "::error::$name が完了していません（$result）"; failed=1 ;;
            esac
          done
          exit $failed
