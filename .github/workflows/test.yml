name: test

# lint（eslint）とユニットテスト（Node 標準の test runner）と配布物検証（公式 validator）。
# eslint はテンプレート .mjs（配備先へコピーされる hook / installer）が配備先の CI を
# 壊さないよう source 側で検証する。テスト対象は hook（PR 前門番・effort nudge）と apply.mjs。
# validate は配布物そのもの（manifest とコンポーネント）を検査する。lint と test が緑のまま
# marketplace 経由の導入側でだけ壊れる層を、配布前に落とすのが目的。
# 実行内容の正本は package.json の scripts.validate（marketplace.json と plugin.json を
# 別々に渡すのは、validator が前者からは plugin.json までしか辿らず skills/ を見ず、
# 後者からは skills/ を見るが marketplace を見ないため。両方渡して初めて全層を覆える）。
#
# analyzer ジョブは配布する Roslyn analyzer の規則そのものを検証する。node 側のテストは
# 「ソースを変えて build.mjs を流し忘れていないか」しか見ないので、規則の正しさはここで見る。

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run validate

  # 配布物を変えた PR で skill 版の bump 忘れを止める。テンプレ自動追随の drift 判定は
  # skill 版どうしの比較で行うため、上げ忘れると更新がどの配備先にも黙って届かない
  # （エラーも出ない）。base との比較が要るので fetch-depth: 0、PR のときだけ走らせる。
  skill-version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-skill-version-bump.mjs "origin/${{ github.base_ref }}"

  analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # analyzer 本体は netstandard2.0（Unity 同梱の Roslyn 4.3.1 に合わせる）。
          # ここで指定するのはテストを走らせる SDK の版。
          dotnet-version: 10.0.x
      - run: npm run test:analyzer
