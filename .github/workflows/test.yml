name: test

# lint（eslint）とユニットテスト（Node 標準の test runner）。
# eslint はテンプレート .mjs（配備先へコピーされる hook / installer）が配備先の CI を
# 壊さないよう source 側で検証する。テスト対象は hook（PR 前門番・effort nudge）と apply.mjs。
#
# analyzer ジョブは配布する Roslyn analyzer の規則そのものを検証する。node 側のテストは
# 「ソースを変えて build.mjs を流し忘れていないか」しか見ないので、規則の正しさはここで見る。

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test

  analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # analyzer 本体は netstandard2.0（Unity 同梱の Roslyn 4.3.1 に合わせる）。
          # ここで指定するのはテストを走らせる SDK の版。
          dotnet-version: 10.0.x
      - run: npm run test:analyzer
